name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  LIBGIT2_SYS_USE_PKG_CONFIG: "1"
  # Pinned so CI does not float to the latest gh-aw release. Bumping this is a
  # deliberate change: update it, run `gh aw compile`, and commit the locks.
  GH_AW_VERSION: v0.85.4

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install system libraries (libgit2, OpenSSL)
        run: |
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y libgit2-dev libssl-dev pkg-config && break || sleep 15
          done

      - name: Build
        run: cargo build --workspace

      - name: Lint AI plugins
        run: ./target/debug/aipm lint . --reporter ci-github

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Format
        run: cargo fmt --check

  aw-lock-drift:
    name: Agentic workflow lock drift
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install gh-aw (pinned)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-aw --pin "$GH_AW_VERSION"

      - name: Recompile agentic workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh aw compile

      - name: Fail if lock files are out of date
        run: |
          if ! git diff --exit-code -- .github/workflows .github/aw .gitattributes; then
            echo "::error::Agentic workflow lock files are out of date. Run 'gh aw compile' with gh-aw ${GH_AW_VERSION} and commit the result."
            exit 1
          fi

      - name: Fail if compile produced untracked files
        run: |
          UNTRACKED=$(git ls-files --others --exclude-standard -- .github/workflows .github/aw)
          if [ -n "$UNTRACKED" ]; then
            echo "::error::'gh aw compile' produced untracked files. Either commit them or remove the orphaned source."
            echo "$UNTRACKED"
            exit 1
          fi

      - name: Fail if lock files disagree on compiler version
        run: |
          # head -qn1 reads the first line of *each* file; `sed -n '1p'` would
          # treat them as one concatenated stream and only inspect the first.
          VERSIONS=$(head -qn1 .github/workflows/*.lock.yml \
            | grep -o '"compiler_version":"[^"]*"' \
            | sort -u)
          echo "$VERSIONS"
          if [ "$(echo "$VERSIONS" | wc -l)" -ne 1 ]; then
            echo "::error::Lock files were compiled with different gh-aw versions. Recompile them all with ${GH_AW_VERSION}."
            exit 1
          fi

  coverage:
    name: Coverage (89% branch gate)
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
      # Single source of truth for both the lcov report and the gate below, so
      # they cannot drift apart. Must stay in sync with the coverage command
      # documented in CLAUDE.md, or local runs and CI measure different code.
      COV_IGNORE_REGEX: '(tests/|research/|specs/|wizard_tty\.rs|lsp\.rs|libaipm-engine-spec/build\.rs|libaipm-engine-spec/src/bin)'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - uses: actions/setup-node@v4
        with:
          node-version: '22.6.0'

      - uses: taiki-e/install-action@cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2

      - name: Install system libraries (libgit2, OpenSSL)
        run: |
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y libgit2-dev libssl-dev pkg-config && break || sleep 15
          done

      - name: Clean coverage artifacts
        run: cargo llvm-cov clean --workspace

      - name: Run all tests with branch coverage
        run: cargo llvm-cov --no-report --workspace --branch

      - name: Run doctests with branch coverage
        run: cargo llvm-cov --no-report --doc --branch

      - name: Generate lcov report
        run: >
          cargo llvm-cov report --doctests --branch
          --ignore-filename-regex "$COV_IGNORE_REGEX"
          --lcov --output-path lcov.info

      - name: Enforce 89% branch coverage (strict — never lower this threshold)
        run: |
          OUTPUT=$(cargo llvm-cov report --doctests --branch \
            --ignore-filename-regex "$COV_IGNORE_REGEX" 2>&1)
          echo "$OUTPUT"
          BRANCH_PCT=$(echo "$OUTPUT" | grep '^TOTAL' | awk '{print $NF}' | tr -d '%')
          if [ -z "$BRANCH_PCT" ]; then
            echo "::error::Could not parse branch coverage percentage"
            exit 1
          fi
          echo "Branch coverage: ${BRANCH_PCT}%"
          if awk "BEGIN {exit !($BRANCH_PCT < 89)}"; then
            echo "::error::Branch coverage ${BRANCH_PCT}% is below 89% threshold"
            exit 1
          fi

      - name: Upload to Codecov
        if: ${{ always() }}
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: lcov.info
          fail_ci_if_error: false
