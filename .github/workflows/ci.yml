name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  LIBGIT2_SYS_USE_PKG_CONFIG: "1"
  # Pinned gh-aw compiler version. Every committed `.github/workflows/*.lock.yml`
  # records this in its `# gh-aw-metadata:` header as `compiler_version` — the
  # two MUST stay in sync. See "Keep every lock file on the same compiler
  # version" in CLAUDE.md. Never float this to `latest`.
  GH_AW_VERSION: v0.86.2

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install system libraries (libgit2, OpenSSL)
        run: |
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y libgit2-dev libssl-dev pkg-config && break || sleep 15
          done

      - name: Build
        run: cargo build --workspace

      - name: Lint AI plugins
        run: ./target/debug/aipm lint . --reporter ci-github

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Format
        run: cargo fmt --check

  aw-lock-drift:
    name: Agentic workflow lock drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned gh-aw extension
        run: gh extension install github/gh-aw --pin "$GH_AW_VERSION"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Compile agentic workflows
        run: gh aw compile

      - name: Fail on lock-file drift
        run: |
          if ! git diff --exit-code -- .github/workflows .github/aw; then
            echo "::error::Lock files are out of date. Run 'gh aw compile' with gh-aw $GH_AW_VERSION and commit the result."
            exit 1
          fi

      - name: Fail on untracked compiler output
        run: |
          UNTRACKED=$(git status --porcelain --untracked-files=all -- .github/workflows .github/aw)
          if [ -n "$UNTRACKED" ]; then
            echo "::error::gh aw compile produced untracked files (orphaned .md source or unexpected output):"
            echo "$UNTRACKED"
            exit 1
          fi

      - name: Assert uniform compiler_version across locks
        run: |
          VERSIONS=$(grep -ho '"compiler_version":"[^"]*"' .github/workflows/*.lock.yml | sort -u)
          COUNT=$(echo "$VERSIONS" | wc -l)
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Lock files were compiled with different gh-aw versions:"
            echo "$VERSIONS"
            exit 1
          fi
          LOCK_VERSION=$(echo "$VERSIONS" | sed 's/"compiler_version":"//; s/"//')
          if [ "$LOCK_VERSION" != "$GH_AW_VERSION" ]; then
            echo "::error::Locks were compiled with $LOCK_VERSION but CI pins $GH_AW_VERSION. Update GH_AW_VERSION in ci.yml and recompile all workflows."
            exit 1
          fi
          echo "All locks compiled with $LOCK_VERSION (matches pinned GH_AW_VERSION)"

  coverage:
    name: Coverage (89% branch gate)
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
      # Must match the coverage command documented in CLAUDE.md exactly.
      COVERAGE_IGNORE_REGEX: '(tests/|research/|specs/|wizard_tty\.rs|lsp\.rs|libaipm-engine-spec/build\.rs|libaipm-engine-spec/src/bin)'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - uses: actions/setup-node@v4
        with:
          node-version: '22.6.0'

      - uses: taiki-e/install-action@cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2

      - name: Install system libraries (libgit2, OpenSSL)
        run: |
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y libgit2-dev libssl-dev pkg-config && break || sleep 15
          done

      - name: Clean coverage artifacts
        run: cargo llvm-cov clean --workspace

      - name: Run all tests with branch coverage
        run: cargo llvm-cov --no-report --workspace --branch

      - name: Run doctests with branch coverage
        run: cargo llvm-cov --no-report --doc --branch

      - name: Generate lcov report
        run: >
          cargo llvm-cov report --doctests --branch
          --ignore-filename-regex "$COVERAGE_IGNORE_REGEX"
          --lcov --output-path lcov.info

      - name: Enforce 89% branch coverage (strict — never lower this threshold)
        run: |
          OUTPUT=$(cargo llvm-cov report --doctests --branch \
            --ignore-filename-regex "$COVERAGE_IGNORE_REGEX" 2>&1)
          echo "$OUTPUT"
          BRANCH_PCT=$(echo "$OUTPUT" | grep '^TOTAL' | awk '{print $NF}' | tr -d '%')
          if [ -z "$BRANCH_PCT" ]; then
            echo "::error::Could not parse branch coverage percentage"
            exit 1
          fi
          echo "Branch coverage: ${BRANCH_PCT}%"
          if awk "BEGIN {exit !($BRANCH_PCT < 89)}"; then
            echo "::error::Branch coverage ${BRANCH_PCT}% is below 89% threshold"
            exit 1
          fi

      - name: Upload to Codecov
        if: ${{ always() }}
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: lcov.info
          fail_ci_if_error: false
