name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  LIBGIT2_SYS_USE_PKG_CONFIG: "1"
  # Canonical gh-aw compiler pin. To upgrade: bump here, recompile every lock
  # with `gh aw compile`, and commit the results in the same change. Referenced
  # from CLAUDE.md ("Keep every lock file on the same compiler version").
  GH_AW_VERSION: v0.86.2

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install system libraries (libgit2, OpenSSL)
        run: |
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y libgit2-dev libssl-dev pkg-config && break || sleep 15
          done

      - name: Build
        run: cargo build --workspace

      - name: Lint AI plugins
        run: ./target/debug/aipm lint . --reporter ci-github

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Format
        run: cargo fmt --check

  coverage:
    name: Coverage (89% branch gate)
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
      # Must match the coverage command documented in CLAUDE.md exactly.
      COVERAGE_IGNORE_REGEX: '(tests/|research/|specs/|wizard_tty\.rs|lsp\.rs|libaipm-engine-spec/build\.rs|libaipm-engine-spec/src/bin)'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - uses: actions/setup-node@v4
        with:
          node-version: '22.6.0'

      - uses: taiki-e/install-action@cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2

      - name: Install system libraries (libgit2, OpenSSL)
        run: |
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y libgit2-dev libssl-dev pkg-config && break || sleep 15
          done

      - name: Clean coverage artifacts
        run: cargo llvm-cov clean --workspace

      - name: Run all tests with branch coverage
        run: cargo llvm-cov --no-report --workspace --branch

      - name: Run doctests with branch coverage
        run: cargo llvm-cov --no-report --doc --branch

      - name: Generate lcov report
        run: >
          cargo llvm-cov report --doctests --branch
          --ignore-filename-regex "$COVERAGE_IGNORE_REGEX"
          --lcov --output-path lcov.info

      - name: Enforce 89% branch coverage (strict — never lower this threshold)
        run: |
          OUTPUT=$(cargo llvm-cov report --doctests --branch \
            --ignore-filename-regex "$COVERAGE_IGNORE_REGEX" 2>&1)
          echo "$OUTPUT"
          BRANCH_PCT=$(echo "$OUTPUT" | grep '^TOTAL' | awk '{print $NF}' | tr -d '%')
          if [ -z "$BRANCH_PCT" ]; then
            echo "::error::Could not parse branch coverage percentage"
            exit 1
          fi
          echo "Branch coverage: ${BRANCH_PCT}%"
          if awk "BEGIN {exit !($BRANCH_PCT < 89)}"; then
            echo "::error::Branch coverage ${BRANCH_PCT}% is below 89% threshold"
            exit 1
          fi

      - name: Upload to Codecov
        if: ${{ always() }}
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: lcov.info
          fail_ci_if_error: false

  aw-lock-drift:
    name: Agentic workflow lock drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned via GH_AW_VERSION so a surprise upstream release never breaks CI.
      - name: Install pinned gh-aw extension
        run: |
          gh extension install github/gh-aw --pin "$GH_AW_VERSION"
          gh aw version
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Recompile all agentic workflow locks
        run: gh aw compile

      - name: Fail on lock drift or compiler-version skew
        run: |
          if ! git diff --exit-code -- .github/workflows .github/aw; then
            echo "::error::Lock files are out of date. Run 'gh aw compile' with gh-aw $GH_AW_VERSION and commit the result."
            exit 1
          fi
          untracked=$(git status --porcelain --untracked-files=all -- .github/workflows .github/aw | grep '^??' || true)
          if [ -n "$untracked" ]; then
            echo "::error::'gh aw compile' produced untracked files — commit them or delete the orphaned .md source:"
            echo "$untracked"
            exit 1
          fi
          versions=$(grep -ho '"compiler_version":"[^"]*"' .github/workflows/*.lock.yml | sort -u)
          if [ "$(echo "$versions" | wc -l)" -ne 1 ]; then
            echo "::error::Lock files were compiled with mixed gh-aw versions. Recompile all locks with gh-aw $GH_AW_VERSION:"
            echo "$versions"
            exit 1
          fi
          if [ "$versions" != "\"compiler_version\":\"$GH_AW_VERSION\"" ]; then
            echo "::error::Lock files were compiled with $versions but the pinned version is $GH_AW_VERSION. Recompile all locks with gh-aw $GH_AW_VERSION and commit."
            exit 1
          fi
